<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#140c2e"/>
      <stop offset="100%" stop-color="#090214"/>
    </linearGradient>
    <linearGradient id="sp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="sp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sp-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sp-glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#sp-bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.06" stroke="#915EFF" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="800" height="60" rx="16" fill="#13092b" fill-opacity="0.95"/>
  <rect x="0" y="30" width="800" height="30" fill="#13092b" fill-opacity="0.95"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#915EFF" stroke-opacity="0.2"/>

  <!-- Logo & Title -->
  <circle cx="36" cy="30" r="14" fill="url(#sp-purple)" filter="url(#sp-glow)"/>
  <text x="36" y="35" font-family="'Poppins', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">✦</text>
  <text x="62" y="35" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#ffffff">AI Smart Study Planner</text>

  <!-- Status Badge: In Development -->
  <g transform="translate(620, 16)">
    <rect width="150" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#fbbf24"/>
    <text x="28" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">IN DEVELOPMENT</text>
  </g>

  <!-- Main Left Card: Study Roadmap & Modules -->
  <rect x="30" y="85" width="440" height="385" rx="14" fill="#181038" fill-opacity="0.75" stroke="#915EFF" stroke-opacity="0.25"/>
  <text x="50" y="118" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#ffffff">Active Study Schedule</text>
  <text x="50" y="136" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">Intelligent spaced repetition &amp; automated topic pacing</text>

  <!-- Schedule Items -->
  <g transform="translate(50, 155)">
    <!-- Item 1 -->
    <rect width="400" height="65" rx="10" fill="#1e1445" stroke="#915EFF" stroke-opacity="0.3"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="url(#sp-purple)"/>
    <text x="20" y="26" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Java Core &amp; Collections Framework</text>
    <text x="20" y="46" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">OOP, Multithreading &amp; Memory Model • 2.5 hrs</text>
    <rect x="310" y="20" width="75" height="22" rx="11" fill="url(#sp-emerald)" fill-opacity="0.2"/>
    <text x="347" y="35" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Completed</text>

    <!-- Item 2 -->
    <g transform="translate(0, 78)">
      <rect width="400" height="65" rx="10" fill="#1e1445" stroke="#06b6d4" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="4" height="65" rx="2" fill="url(#sp-cyan)"/>
      <text x="20" y="26" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Spring Boot REST API &amp; JPA</text>
      <text x="20" y="46" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">Controllers, Services, Repositories • 3.0 hrs</text>
      <rect x="310" y="20" width="75" height="22" rx="11" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="347" y="35" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">In Progress</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 156)">
      <rect width="400" height="65" rx="10" fill="#1e1445" stroke="#915EFF" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="4" height="65" rx="2" fill="#71717a"/>
      <text x="20" y="26" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#e4e4e7">MySQL Database Schema &amp; Indexing</text>
      <text x="20" y="46" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">Relational entities, joins, query optimization • 2.0 hrs</text>
      <rect x="310" y="20" width="75" height="22" rx="11" fill="#71717a" fill-opacity="0.2"/>
      <text x="347" y="35" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle">Upcoming</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 234)">
      <rect width="400" height="65" rx="10" fill="#1e1445" stroke="#915EFF" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="4" height="65" rx="2" fill="#71717a"/>
      <text x="20" y="26" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#e4e4e7">AI Schedule Optimization Algorithm</text>
      <text x="20" y="46" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">Dynamic study plan rebalancing based on pacing</text>
      <rect x="310" y="20" width="75" height="22" rx="11" fill="#71717a" fill-opacity="0.2"/>
      <text x="347" y="35" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle">Planned</text>
    </g>
  </g>

  <!-- Right Panel: Architecture & Analytics -->
  <rect x="490" y="85" width="280" height="385" rx="14" fill="#181038" fill-opacity="0.75" stroke="#915EFF" stroke-opacity="0.25"/>
  <text x="510" y="118" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#ffffff">System Architecture</text>
  <text x="510" y="136" font-family="'Poppins', sans-serif" font-size="11" fill="#aaa6c3">Full-stack technology foundation</text>

  <!-- Tech Badges on Right -->
  <g transform="translate(510, 160)">
    <!-- Backend -->
    <rect width="240" height="48" rx="8" fill="#1f1545" stroke="#f89820" stroke-width="0.8"/>
    <circle cx="24" cy="24" r="10" fill="#f89820" fill-opacity="0.2"/>
    <text x="24" y="28" font-size="10" font-weight="900" fill="#f89820" text-anchor="middle">J</text>
    <text x="44" y="23" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Java 17 / Spring Boot</text>
    <text x="44" y="38" font-family="'Poppins', sans-serif" font-size="10" fill="#aaa6c3">REST Controller Architecture</text>

    <!-- Database -->
    <g transform="translate(0, 58)">
      <rect width="240" height="48" rx="8" fill="#1f1545" stroke="#00758f" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="10" fill="#00758f" fill-opacity="0.2"/>
      <text x="24" y="28" font-size="10" font-weight="900" fill="#00758f" text-anchor="middle">M</text>
      <text x="44" y="23" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff">MySQL Database</text>
      <text x="44" y="38" font-family="'Poppins', sans-serif" font-size="10" fill="#aaa6c3">JPA Entities &amp; Relationships</text>
    </g>

    <!-- Intelligent Planner -->
    <g transform="translate(0, 116)">
      <rect width="240" height="48" rx="8" fill="#1f1545" stroke="#915EFF" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="10" fill="#915EFF" fill-opacity="0.2"/>
      <text x="24" y="28" font-size="10" font-weight="900" fill="#915EFF" text-anchor="middle">✦</text>
      <text x="44" y="23" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Smart Study Engine</text>
      <text x="44" y="38" font-family="'Poppins', sans-serif" font-size="10" fill="#aaa6c3">Adaptive Scheduling Logic</text>
    </g>
  </g>

  <!-- Progress Bar Box -->
  <g transform="translate(510, 345)">
    <rect width="240" height="105" rx="10" fill="#140a2b" stroke="#915EFF" stroke-opacity="0.2"/>
    <text x="16" y="26" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Development Progress</text>
    <text x="16" y="44" font-family="'Poppins', sans-serif" font-size="10" fill="#aaa6c3">Core entity modeling &amp; API routes</text>

    <!-- Progress Track -->
    <rect x="16" y="58" width="208" height="8" rx="4" fill="#24194c"/>
    <rect x="16" y="58" width="135" height="8" rx="4" fill="url(#sp-purple)"/>

    <text x="16" y="88" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#915EFF">65% Milestone 1 Reached</text>
  </g>
</svg>